aid: carrum-health
name: Carrum Health
description: 'Carrum Health operates a value-based Centers of Excellence (COE) platform
  that connects self-insured employers and their members with a curated national network
  of surgical, cancer and substance-use-care providers under upfront bundled payments.
  Founded in 2014, the company pairs a member-facing mobile and web application with
  a care-navigation team so members are guided through the full episode of care with
  no deductibles, co-pays or surprise bills, and a 30-day warranty on each procedure.
  Carrum sells to employers and benefits consultants and integrates with health plans,
  TPAs and point-solution partners such as Hinge Health, Sword Health, AccessHope,
  Teladoc and Accolade. Carrum publishes no public developer program: there is no
  public API portal, OpenAPI definition, SDK or documentation host. The platform is
  backed by a set of internet-facing REST services (core, care, message, price and
  upload) discovered in the public member-application bundle, each of which serves
  an HTTP Basic-gated /api-docs surface, and core-service publishes an A2A agent registry
  at /.well-known/agents.json that is currently empty.'
