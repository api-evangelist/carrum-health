apis:
- name: Carrum Health Platform Services
  description: 'The internet-facing REST services that power the Carrum Health member
    application (my.carrumhealth.com): core-service (accounts, episodes, profiles),
    care-service, message-service, price-service and upload-service, each also deployed
    to staging, uat, demo, perf, compliance and mirror environments. These hosts were
    observed in the provider''s own publicly served web-application bundle. No public
    documentation, OpenAPI definition or self-service onboarding is published; every
    /api-docs surface answers HTTP 401 with a WWW-Authenticate: Basic challenge, so
    the API program is private/partner-only.'
